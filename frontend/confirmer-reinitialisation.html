<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation - Gestion de Notes Universitaire</title>
<script>
  tailwind = { config: { theme: { extend: { colors: {
    blue: { 50: '#822522', 100: '#822522', 200: '#822522', 300: '#822522', 400: '#822522', 500: '#822522', 600: '#822522', 700: '#822522', 800: '#822522', 900: '#822522', 950: '#822522' },
    white: '#B0ACA3'
  } } } } };
</script>
<!--<script src="https://cdn.tailwindcss.com"></script>-->
<link rel="stylesheet" href="css/output.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
    <div class="mx-auto w-14 h-14 rounded-full bg-blue-900 flex items-center justify-center text-white text-2xl font-bold">
      <img src="photos/logo_note.jpg"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
           style="width:50px; height:50px; border-radius:50%;"
           alt="Logo Université d'Antsiranana">
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mt-4">Confirmation de réinitialisation</h1>

    <div id="zoneChargement" class="mt-6">
      <p class="text-gray-500 text-sm">Vérification du lien en cours...</p>
    </div>

    <div id="zoneSucces" class="mt-6 hidden">
      <p class="text-green-700 font-medium" id="texteSucces"></p>
      <a href="index.html" class="inline-block mt-4 bg-blue-900 hover:bg-blue-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
        Aller à la connexion
      </a>
    </div>

    <div id="zoneErreur" class="mt-6 hidden">
      <p class="text-red-700 font-medium" id="texteErreur"></p>
      <a href="mot-de-passe-oublie.html" class="inline-block mt-4 bg-blue-900 hover:bg-blue-800 text-white font-semibold px-5 py-2.5 rounded-lg transition">
        Refaire une demande
      </a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    (async () => {
      const zoneChargement = document.getElementById('zoneChargement');
      const zoneSucces = document.getElementById('zoneSucces');
      const zoneErreur = document.getElementById('zoneErreur');

      const parametres = new URLSearchParams(window.location.search);
      const token = parametres.get('token');

      if (!token) {
        zoneChargement.classList.add('hidden');
        document.getElementById('texteErreur').textContent = 'Lien de confirmation invalide ou incomplet.';
        zoneErreur.classList.remove('hidden');
        return;
      }

      try {
        // Appel direct (pas besoin de token JWT, c'est une route publique)
        const reponse = await fetch(`${API_BASE_URL}/auth/confirmer-reinitialisation/${encodeURIComponent(token)}`);
        const donnees = await reponse.json();

        zoneChargement.classList.add('hidden');
        if (reponse.ok) {
          document.getElementById('texteSucces').textContent = donnees.message;
          zoneSucces.classList.remove('hidden');
        } else {
          document.getElementById('texteErreur').textContent = donnees.message || 'Impossible de confirmer la réinitialisation.';
          zoneErreur.classList.remove('hidden');
        }
      } catch (erreur) {
        zoneChargement.classList.add('hidden');
        document.getElementById('texteErreur').textContent = 'Erreur réseau : impossible de contacter le serveur.';
        zoneErreur.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
