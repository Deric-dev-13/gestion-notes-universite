<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Gestion de Notes Universitaire</title>
<!-- Tailwind CSS via CDN, comme recommandé par le cahier des charges (5.1) -->
<script>
  tailwind = { config: { theme: { extend: { colors: {
    blue: { 50: '#822522', 100: '#822522', 200: '#822522', 300: '#822522', 400: '#822522', 500: '#822522', 600: '#822522', 700: '#822522', 800: '#822522', 900: '#822522', 950: '#822522' },
    white: '#B0ACA3'
  } } } } };
</script>
<!--<script src="https://cdn.tailwindcss.com"></script>-->
<link rel="stylesheet" href="css/output.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
    <div class="text-center mb-8">
      <div class="flex items-center justify-between gap-2 border-b-2 pb-4" style="border-color:#822522; -webkit-print-color-adjust:exact; print-color-adjust:exact;">
           <!-- Logo Établissement (Gauche) -->
        <div class="flex-shrink-0">
          <img src="photos/logo_universite.jpg"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
             style="width:70px; height:70px; border-radius: 50%;"
             alt="Logo Université d'Antsiranana">
          <div style="display:none; width:64px; height:64px; border-radius:50%; border:2px solid #822522; background:#822522; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px;">
           <span style="font-size:10px; font-weight:900; color:#0f172a; line-height:1.2;">UNA</span>
           <span style="font-size:7px; color:#4b5563; text-transform:uppercase; font-weight:600;">Université d'Antsiranana</span>
         </div>
       </div>

        
         <div class="flex-shrink-0">
          <img src="photos/logo_note.jpg"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
             style="width:120px; height:100px; object-fit:contain;"
             alt="Logo Université d'Antsiranana">
          <div style="display:none; width:64px; height:64px; border-radius:50%; border:2px solid #ca8a04; background:#fefce8; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px;">
           <span style="font-size:10px; font-weight:900; color:#0f172a; line-height:1.2;">REPOBLIKA</span>
           <span style="font-size:7px; color:#92400e; text-transform:uppercase; font-weight:600;">Madagasikara</span>
          </div>
         </div>

       <div class="flex-shrink-0">
          <img src="photos/logo_enset.jpg"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
             style="width: 70px; height:70px; border-radius: 50%;"
             alt="Logo Université d'Antsiranana">
          <div style="display:none; width:64px; height:64px; border-radius:50%; border:2px solid #ca8a04; background:#fefce8; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px;">
           <span style="font-size:10px; font-weight:900; color:#0f172a; line-height:1.2;">ENSET</span>
           <span style="font-size:7px; color:#92400e; text-transform:uppercase; font-weight:600;">École Normale</span>
          </div>
       </div>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mt-4">
      
       <span class="score">N</span><span class="total">/20</span>
    
    </h1>
      <p class="text-gray-500 text-sm mt-1">Connectez-vous avec vos identifiants</p>
    </div>

    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Identifiant (email)</label>
        <input type="text" id="identifiant" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <a href="mot-de-passe-oublie.html" class="text-xs text-blue-800 hover:underline">Mot de passe oublié ?</a>
        </div>
        <input type="password" id="motDePasse" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800">
      </div>

      <div id="messageErreur" class="hidden"></div>

      <button type="submit" id="btnConnexion"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">
        Se connecter
      </button>
    </form>

    <div class="text-center mt-4 pt-4 border-t border-gray-100">
      <p class="text-sm text-gray-500">
        Pas encore de compte ?
        <a href="inscription.html" class="text-blue-800 font-semibold hover:underline">Créer un compte</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // -------------------------------------------------------------
    // Logique de la page de connexion
    // -------------------------------------------------------------
    const formulaire = document.getElementById('formLogin');
    const boutonConnexion = document.getElementById('btnConnexion');

    formulaire.addEventListener('submit', async (evenement) => {
      evenement.preventDefault(); // empêche le rechargement classique de la page

      const identifiant = document.getElementById('identifiant').value.trim();
      const motDePasse = document.getElementById('motDePasse').value;

      boutonConnexion.disabled = true;
      boutonConnexion.textContent = 'Connexion...';

      try {
        const reponse = await appelApi('/auth/login', 'POST', { identifiant, mot_de_passe: motDePasse });

        // On stocke le token et le rôle, puis on redirige vers l'espace correspondant
        enregistrerSession(reponse);

        switch (reponse.role) {
          case 'admin':
            window.location.href = 'admin/index.html';
            break;
          case 'enseignant':
            window.location.href = 'enseignant/index.html';
            break;
          case 'etudiant':
            window.location.href = 'etudiant/index.html';
            break;
        }
      } catch (erreur) {
        if (erreur.message.toLowerCase().includes('compte inactif')) {
          localStorage.setItem('validationEmail', identifiant);
          window.location.href = 'attente-validation.html';
          return;
        }
        afficherMessage('messageErreur', erreur.message);
      } finally {
        boutonConnexion.disabled = false;
        boutonConnexion.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
